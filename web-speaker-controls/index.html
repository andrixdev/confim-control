<!DOCTYPE html>
<html lang="en">
<head>
	<title>Confim 7 Speaker Controls 🤘</title>

	<!-- Meta stuff -->
	<meta charset="utf-8" />
	<meta name="keywords" content="OSC, control, app, immersive, planetarium, conference" />
	<meta name="author" content="Alex Andrix" />
	<meta name="description" content="Control app for immersive conferences" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, target-densitydpi=device-dpi, minimum-scale=1" />
	
	<!-- Icons -->
	<link rel="icon" type="image/png" sizes="32x32" href="../sources/favicon.ico">
	
	<!-- Stylesheets -->
	<link rel="stylesheet" type="text/css" href="../sources/css/main.css" />

<body>

	<header>
		<h2 id="title" class="manuscript speaker">Conférence Immersive - Philippe et Antoinette</h2>
		<div id="loadbar"><div id="loadbar-inner"></div></div>
	</header>

	<div id="content" class="speaker">

		<!-- Steps -->
		<div id="steps">

			<!-- Chapter 1 -->
			<div class="step flexrow flexstart flexwrap active">
				<img class="item-preview section" data-confim-id="1" src="../sources/img/tilted-blue-square.png" alt="Enceladus" />
				<div class="flexcol flexstart">
					<img class="item-preview" data-switch-off-img id="switch-img-default" src="../sources/img/tilted-blue-square.png" alt="Enceladus Default" />
					<img class="item-preview" data-switch-on-img id="switch-img-blossom" src="../sources/img/tilted-blue-square.png" alt="Enceladus Blossom" />
					<div class="switch off" data-confim-id="110" data-switch-off-img-id="switch-img-default" data-switch-on-img-id="switch-img-blossom"><div class="switch-inner"></div></div>
				</div>
			</div>

			<!-- Chapter 2 -->
			<div class="step flexrow flexstart flexwrap flexchildrenstart">
				<img class="item-preview section" data-confim-id="2" src="../sources/img/tilted-blue-square.png" alt="Petunia close-up" />
				<img class="item-preview" data-confim-id="53" src="../sources/img/tilted-blue-square.png" alt="Petunia captions" />
			</div>

			<!-- Chapter 3 -->
			<div class="step flexrow flexstart flexwrap">
				<img class="item-preview section" data-confim-id="3" src="../sources/img/tilted-blue-square.png" alt="Petunia full plant" />
				<img class="item-preview" data-confim-id="54" src="../sources/img/tilted-blue-square.png" alt="Meristem" />
			</div>

			<!-- Chapter 4 -->
			<div class="step flexrow flexstart flexwrap">
				<img class="item-preview section" data-confim-id="4" src="../sources/img/tilted-blue-square.png" alt="Flower development 1" />
			</div>

			<!-- Chapter 5 -->
			<div class="step flexrow flexstart flexwrap">
				<img class="item-preview section" data-confim-id="5" src="../sources/img/tilted-blue-square.png" alt="Flower development 2" />
			</div>

			<!-- Chapter 6 -->
			<div class="step flexrow flexstart flexwrap">
				<img class="item-preview section" data-confim-id="6" src="../sources/img/tilted-blue-square.png" alt="Flower development 3" />
			</div>

			<!-- Chapter 7 -->

				<img class="item-preview" data-confim-id="56" src="../sources/img/tilted-blue-square.png" alt="Pollinating 2" />
			</div>

			<!-- Chapter 8 -->
			<div class="step flexrow flexstart flexwrap">
				<img class="item-preview section" data-confim-id="8" src="../sources/img/tilted-blue-square.png" alt="Flower development 5" />

			<!-- Chapter 9 -->

					<img class="item-preview" data-confim-id="95" src="../sources/img/tilted-blue-square.png" alt="UMAP 5" />

					<img class="item-preview" src="../sources/img/tilted-blue-square.png" alt="Axes toggles" />

				</div>
			</div>

			<!-- Chapter 13 -->
			<div class="step flexrow flexstart flexwrap">
				<img class="item-preview section" data-confim-id="13" src="../sources/img/tilted-blue-square.png" alt="Flower dev5gen" />
			</div>

			<!-- Chapter 1 (again) -->
			<div class="step flexrow flexstart flexwrap">
				<img class="item-preview section" data-confim-id="1" src="../sources/img/tilted-blue-square.png" alt="Enceladus" />

		<!-- Copyrights -->
